<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="A row in the reports list with three buttons: a pencil to change it, a clock to see reports already sent, and a bin to delete it"><defs><linearGradient id="primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40546b"/><stop offset="1" stop-color="#2d3d4f"/></linearGradient><linearGradient id="secondary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf3f8"/></linearGradient></defs><rect width="680" height="300" fill="#eef3f8"/><rect x="24" y="24" width="632" height="252" rx="8" fill="#f7fafc" stroke="#99aec1"/><text x="48" y="62" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="20" font-weight="600" fill="#07111d" text-anchor="start">Changing a report you already have</text><rect x="48" y="100" width="584" height="60" rx="8" fill="#fbfdff" stroke="#b0c0ce"/><text x="68" y="136" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="16" font-weight="600" fill="#07111d" text-anchor="start">Weekly operations summary</text><rect x="434" y="114" width="44" height="32" rx="8" fill="url(#secondary)" stroke="#98adbf"/><path d="M449 136 l0 -4 l9 -9 l4 4 l-9 9 z" fill="none" stroke="#13253a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="486" y="114" width="44" height="32" rx="8" fill="url(#secondary)" stroke="#98adbf"/><path d="M508 123 a7 7 0 1 0 0.1 0 z M508 126 v4 l3 3" fill="none" stroke="#13253a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="538" y="114" width="44" height="32" rx="8" fill="url(#secondary)" stroke="#98adbf"/><path d="M553 125 h14 M555 125 l1 10 h8 l1 -10 M557 122 h6" fill="none" stroke="#13253a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="456" cy="186" r="18" fill="#b45309"/><text x="456" y="192" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="68" y="186" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#1f3144" text-anchor="start">1.  Change it</text><circle cx="508" cy="186" r="18" fill="#b45309"/><text x="508" y="192" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="68" y="216" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#1f3144" text-anchor="start">2.  See the ones already sent</text><circle cx="560" cy="186" r="18" fill="#b45309"/><text x="560" y="192" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="68" y="246" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#1f3144" text-anchor="start">3.  Delete it</text></svg>
