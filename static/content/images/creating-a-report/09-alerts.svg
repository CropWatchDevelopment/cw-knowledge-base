<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="The Alerts card with one alert: a name, a condition of Less than, a threshold of 5 and a red highlight colour"><defs><linearGradient id="primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40546b"/><stop offset="1" stop-color="#2d3d4f"/></linearGradient><linearGradient id="secondary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf3f8"/></linearGradient></defs><rect width="680" height="400" fill="#eef3f8"/><rect x="24" y="24" width="632" height="352" rx="8" fill="#f7fafc" stroke="#99aec1"/><text x="48" y="62" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="20" font-weight="600" fill="#07111d" text-anchor="start">Alerts</text><text x="48" y="90" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="400" fill="#465b72" text-anchor="start">Add alert conditions if this report should focus on specific changes.</text><rect x="48" y="108" width="584" height="176" rx="8" fill="#fbfdff" stroke="#b0c0ce"/><text x="68" y="132" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#1f3144" text-anchor="start">Name</text><rect x="68" y="144" width="200" height="46" rx="6" fill="#fbfdff" stroke="#99aec1"/><text x="82" y="173" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#07111d" text-anchor="start">Too cold</text><text x="288" y="132" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#1f3144" text-anchor="start">Condition</text><rect x="288" y="144" width="200" height="46" rx="6" fill="#fbfdff" stroke="#99aec1"/><text x="302" y="173" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#07111d" text-anchor="start">Less than (&lt;)</text><path d="M459 165 l7 7 7 -7" fill="none" stroke="#465b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="132" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#1f3144" text-anchor="start">Threshold</text><rect x="508" y="144" width="104" height="46" rx="6" fill="#fbfdff" stroke="#99aec1"/><text x="522" y="173" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#07111d" text-anchor="start">5</text><circle cx="602" cy="155" r="18" fill="#b45309"/><text x="602" y="161" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="68" y="230" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#1f3144" text-anchor="start">Highlight color</text><rect x="68" y="242" width="64" height="40" rx="6" fill="#dc2626" stroke="#99aec1"/><text x="148" y="269" font-family="ui-monospace, monospace" font-size="16" font-weight="400" fill="#1f3144" text-anchor="start">#DC2626</text><circle cx="240" cy="262" r="18" fill="#b45309"/><text x="240" y="268" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="48" y="300" width="133" height="46" rx="12" fill="url(#secondary)" stroke="#98adbf"/><text x="114.5" y="329" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="16" font-weight="500" fill="#13253a" text-anchor="middle">Add alert</text></svg>
