<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="A temperature line falling through 5 degrees, where the alert is sent, then rising back through 7 degrees, where the rule resets"><defs><linearGradient id="primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#40546b"/><stop offset="1" stop-color="#2d3d4f"/></linearGradient><linearGradient id="secondary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf3f8"/></linearGradient></defs><rect width="680" height="380" fill="#eef3f8"/><rect x="24" y="24" width="632" height="332" rx="8" fill="#f7fafc" stroke="#99aec1"/><text x="48" y="62" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="20" font-weight="600" fill="#07111d" text-anchor="start">What the trigger and reset values do</text><line x1="90" y1="320" x2="620" y2="320" stroke="#99aec1" stroke-width="2"/><line x1="90" y1="110" x2="90" y2="320" stroke="#99aec1" stroke-width="2"/><line x1="90" y1="250" x2="620" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="78" y="256" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="700" fill="#991b1b" text-anchor="end">5 °C</text><line x1="90" y1="200" x2="620" y2="200" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/><text x="78" y="206" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="17" font-weight="700" fill="#166534" text-anchor="end">7 °C</text><path d="M90 160 C 170 150, 220 250, 300 275 S 420 300, 470 235 S 560 150, 620 140" fill="none" stroke="#2c6cb7" stroke-width="3.5" stroke-linecap="round"/><circle cx="256" cy="250" r="8" fill="#dc2626"/><circle cx="497" cy="200" r="8" fill="#059669"/><rect x="196" y="84" width="190" height="32" rx="8" fill="#fee2e2" stroke="#fca5a5"/><text x="291" y="105" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#991b1b" text-anchor="middle">Alert sent</text><line x1="256" y1="116" x2="256" y2="240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="420" y="84" width="210" height="32" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="525" y="105" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">Back to normal</text><line x1="497" y1="116" x2="497" y2="190" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/><text x="90" y="350" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="16" font-weight="400" fill="#465b72" text-anchor="start">evening</text><text x="620" y="350" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Noto Sans JP', sans-serif" font-size="16" font-weight="400" fill="#465b72" text-anchor="end">morning</text></svg>
